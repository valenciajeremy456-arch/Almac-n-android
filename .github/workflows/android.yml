name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle (Versión 8.4)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Aceptar licencias de Android SDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Compilar APK Debug
      run: gradle :app:assembleDebug --stacktrace

    - name: Limpiar caché de Gradle
      run: gradle clean

    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: AlmacenApp-Android
        path: app/build/outputs/apk/debug/app-debug.apk
